[PHP]
date.timezone = Asia/Ho_Chi_Minh
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 20M
max_execution_time = 60
default_charset = "UTF-8"

[mysqli]
mysqli.default_port = 3306
mysqli.reconnect = Off
